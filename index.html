<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>플레이리스트 스튜디오</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="firebase-config.js"></script>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e8eaf0;--sub:#9aa0ad;
  --acc:#ff4d6d;--acc2:#7c5cff;--ok:#2ecc71;--warn:#f5b041;--err:#ff5c5c;
  --maxw:640px;--r:14px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);--navh:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;-webkit-appearance:none;appearance:none;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
textarea{min-height:110px;resize:vertical}
a{color:#8ab4ff}
.hidden{display:none!important}
#app{max-width:var(--maxw);margin:0 auto;padding-bottom:calc(var(--navh) + var(--sb) + 90px)}
body.has-mini #app{padding-bottom:calc(var(--navh) + var(--sb) + 150px)}
.top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--st) + 12px) 16px 10px;display:flex;align-items:center;gap:8px}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:15px;flex:none}
.brand h1{font-size:17px;margin:0;white-space:nowrap}
.brand p{margin:0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.icon-btn:active{background:var(--card2)}
.dot{width:12px;height:12px;border-radius:50%;background:#555;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.dot.on{background:var(--ok)}.dot.wait{background:var(--warn)}.dot.err{background:var(--err)}
.tools{padding:0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--sub);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
main{padding:8px 16px}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.empty b{display:block;font-size:42px;margin-bottom:8px}
/* grid (thumbnails) */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.gcard{background:var(--card);border-radius:var(--r);overflow:hidden;text-align:left}
.ph{aspect-ratio:16/9;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;color:var(--sub);font-size:22px}
.ph.has{font-size:0}
.ph .pend{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px}
.ph .pend small{font-size:11px;color:var(--sub)}
.ph.has .pend{display:none}
.gcard .gt{padding:8px 10px 10px}
.gt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt small{color:var(--sub);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* rows */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.row .rb{flex:1;min-width:0}
.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row small{color:var(--sub);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;flex:none;font-size:15px}
.play.now{box-shadow:0 0 0 3px rgba(255,77,109,.35)}
.vthumb{width:112px;flex:none;border-radius:10px;overflow:hidden}
.num{width:22px;text-align:center;color:var(--sub);font-size:12px;flex:none}
/* idea cards */
.icard{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:10px;border-left:4px solid var(--acc2)}
.icard.st-making{border-left-color:var(--warn)}.icard.st-done{border-left-color:var(--ok)}
.icard h3{margin:4px 0 4px;font-size:16px}
.icard p{margin:0;color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--sub)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;color:#c9b8ff;background:rgba(124,92,255,.14);padding:2px 8px;border-radius:999px}
/* nav + fab + mini */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(20,22,28,.97);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav .in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navh)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--sub);position:relative}
.nav button span{font-size:20px;line-height:1}
.nav button.on{color:var(--tx)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.nav i{font-style:normal;font-size:10px;color:var(--sub)}
.fab{position:fixed;z-index:9;right:max(20px,calc(50vw - var(--maxw)/2 + 20px));bottom:calc(var(--navh) + var(--sb) + 18px);width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:30px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.45)}
body.has-mini .fab{bottom:calc(var(--navh) + var(--sb) + 82px)}
.mini{position:fixed;z-index:8;left:0;right:0;bottom:calc(var(--navh) + var(--sb));max-width:var(--maxw);margin:0 auto;background:#1d2029;border-top:1px solid var(--line);padding:8px 12px 10px}
.mini .mr{display:flex;align-items:center;gap:6px}
.mini .mt{flex:1;min-width:0;cursor:pointer}
.mini b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{font-size:11px;color:var(--sub)}
.mini button{width:40px;height:40px;border-radius:10px;font-size:17px}
.mbar{height:4px;background:var(--card2);border-radius:3px;margin-top:7px;cursor:pointer;position:relative}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px;width:0}
/* toast / progress */
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%) translateY(-20px);opacity:0;pointer-events:none;background:#2b2f3a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:100;transition:.2s;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.prog{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 64px);z-index:99;background:#2b2f3a;border-radius:12px;padding:8px 12px;width:min(90vw,360px);font-size:12px}
.prog .pbar{height:5px;background:#444;border-radius:3px;margin-top:6px;overflow:hidden}
.prog .pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
/* layers / sheets */
.layer{position:fixed;inset:0;z-index:20;display:none}
.layer.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:6px 18px calc(24px + var(--sb));animation:up .22s ease-out;overscroll-behavior:contain}
.grab{width:40px;height:5px;border-radius:3px;background:#444;margin:6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.panel h2{font-size:18px;margin:4px 0 14px}
.panel h4{margin:22px 0 10px;font-size:14px;color:var(--sub);display:flex;align-items:center;gap:8px}
.panel h4 .sp{flex:1}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px 2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;padding:0 14px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0}
.btn.danger{color:var(--err)}
.btn.sm{flex:none;min-height:34px;font-size:12px;padding:0 10px;border-radius:9px}
.btn:disabled{opacity:.5}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #444;border-radius:12px;padding:18px;color:var(--sub);cursor:pointer;text-align:center}
.drop.over{border-color:var(--acc2);color:var(--tx)}
.drop input{display:none}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:8px 10px;font-size:13px}
.pitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pgrid .pc{position:relative;aspect-ratio:1;border-radius:9px;background:var(--card2) center/cover no-repeat}
.x{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);font-size:13px;display:grid;place-items:center;flex:none}
.pgrid .x{position:absolute;top:3px;right:3px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--tx);color:#111;font-weight:600}
.hero{border-radius:14px;overflow:hidden;background:#000;margin-bottom:12px}
.hero img,.hero video{display:block;width:100%;max-height:60vh;object-fit:contain;background:#000}
.bigplay{display:flex;align-items:center;gap:14px;background:var(--card2);border-radius:14px;padding:14px;margin-bottom:12px}
.memo{white-space:pre-wrap;word-break:break-word;background:var(--card2);border-radius:12px;padding:12px;font-size:14px}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.trk{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:6px 8px;margin-bottom:6px}
.trk .tb{flex:1;min-width:0;cursor:pointer}
.trk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk small{font-size:11px;color:var(--sub)}
.trk .ar{width:32px;height:32px;border-radius:8px;background:var(--card);font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{border-radius:10px;overflow:hidden;text-align:left;background:var(--card2)}
.mgrid small{display:block;padding:4px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.prow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.prow input{width:22px;height:22px;flex:none;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--acc)}
.prow .rb{flex:1;min-width:0}
.prow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font-size:12px;color:var(--sub)}
pre.diag{white-space:pre-wrap;word-break:break-all;background:#0b0c10;border-radius:10px;padding:10px;font-size:12px;color:#cfd3dc;max-height:260px;overflow:auto}
.note{font-size:12px;color:var(--sub);margin:6px 2px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:1px;background:var(--card2);border-radius:10px;padding:10px 12px;word-break:break-all}
/* viewer */
.viewer{background:#000}
.vstage{position:absolute;inset:0;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
.vstage img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;will-change:transform}
.vtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 8px) 10px 8px 16px;background:linear-gradient(rgba(0,0,0,.6),transparent);font-size:13px;color:#ddd;pointer-events:none}
.vtop button,.vnav{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);font-size:18px;margin-left:6px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);font-size:26px}
.vnav.l{left:10px}.vnav.r{right:10px}
@media(hover:none){.vnav{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">▶</span><div style="min-width:0"><h1>플레이리스트 스튜디오</h1><p id="sum"></p></div></div>
    <button class="icon-btn" data-act="settings" title="동기화 상태"><span id="dot" class="dot"></span></button>
    <button class="icon-btn" data-act="settings" title="설정">⚙️</button>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="검색 (제목 · 메모 · 태그 · 파일명)" autocomplete="off">
    <div id="chips" class="chips"></div>
  </div>
  <main id="list"></main>
</div>

<div id="mini" class="mini hidden">
  <div class="mr">
    <div class="mt" data-act="miniOpen"><b id="mTitle"></b><small id="mSub"></small></div>
    <button data-act="mPrev">⏮</button><button id="mPlay" data-act="mToggle">⏸</button><button data-act="mNext">⏭</button><button data-act="mClose">✕</button>
  </div>
  <div class="mbar" id="mBar"><i></i></div>
</div>

<nav class="nav"><div class="in" id="nav"></div></nav>
<button class="fab" data-act="add" aria-label="추가">＋</button>
<div id="toast"></div>
<div id="prog" class="prog hidden"><div id="progL"></div><div class="pbar"><i id="progB"></i></div></div>

<div class="layer sheet" id="L-detail"><div class="bd" data-act="back"></div><div class="panel"><div class="grab"></div><div id="detailBody"></div></div></div>
<div class="layer sheet" id="L-form"><div class="bd" data-act="formBd"></div><div class="panel" id="formPanel"><div class="grab"></div><div id="formBody"></div></div></div>
<div class="layer sheet" id="L-pick"><div class="bd" data-act="back"></div><div class="panel"><div class="grab"></div><div id="pickBody"></div></div></div>
<div class="layer sheet" id="L-settings"><div class="bd" data-act="back"></div><div class="panel"><div class="grab"></div><div id="setBody"></div></div></div>
<div class="layer viewer" id="L-viewer">
  <div class="vstage" id="vStage"><img id="vImg" alt="" draggable="false"></div>
  <div class="vtop"><span id="vCnt"></span><span><button data-act="vdl" title="다운로드">⬇</button><button data-act="back" title="닫기">✕</button></span></div>
  <button class="vnav l" data-act="vprev">‹</button><button class="vnav r" data-act="vnext">›</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
'use strict';
/* ================= 기본 ================= */
const APP_VER = '1.0.0';
const FOLD = {
  thumb: { name:'썸네일', icon:'🖼️', accept:'image/*' },
  music: { name:'WAV 음악', icon:'🎵', accept:'audio/*,.wav,.mp3,.flac,.m4a,.aac,.ogg' },
  video: { name:'완성 영상', icon:'🎬', accept:'video/*,.mp4,.mov,.webm,.mkv' },
  idea:  { name:'아이디어', icon:'💡', accept:'image/*' },
};
const TABS = ['thumb','music','video','idea'];
const STATUS = { idea:'💭 구상', making:'🛠 제작중', done:'✅ 완성' };
const LS = { items:'mk_items', code:'mk_code', cfg:'mk_fbcfg', tab:'mk_tab' };
const MAXUP = 1024*1024*1024; // 1GB 초과 파일은 이 기기에만 저장

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const stripExt = n => String(n || '').replace(/\.[^.]+$/, '');
const isImg = f => /^image\//.test(f.type || '');
const isAud = f => /^audio\//.test(f.type || '');
const isVid = f => /^video\//.test(f.type || '');
function guessType(name){
  const e = (String(name).split('.').pop() || '').toLowerCase();
  return ({wav:'audio/wav',mp3:'audio/mpeg',flac:'audio/flac',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',
    mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',mkv:'video/x-matroska',
    jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',heic:'image/heic'})[e] || 'application/octet-stream';
}
function fmtSize(b){ if(!b) return '0B'; const u=['B','KB','MB','GB']; let i=0; while(b>=1024&&i<3){b/=1024;i++;} return (i>1?b.toFixed(1):Math.round(b))+u[i]; }
function fmtDur(s){ s=Math.round(s||0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; }
function fmtStamp(s, long){ s=Math.floor(s||0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return long ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }
function parseTags(s){ return [...new Set(String(s||'').split(/[,\s]+/).map(t=>t.replace(/^#+/,'').trim()).filter(Boolean))]; }
function ytId(u){ const m=String(u||'').match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/); return m?m[1]:''; }

let toastT;
function toast(msg, ms=2400){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms); }
function showProgress(label, r){ $('#prog').classList.remove('hidden'); $('#progL').textContent=label; $('#progB').style.width=Math.round((r||0)*100)+'%'; }
function hideProgress(){ $('#prog').classList.add('hidden'); }

/* ================= IndexedDB (원본 파일·썸네일) ================= */
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('makesongs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('media');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('media', mode); const r = fn(t.objectStore('media'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); };
  return {
    get: k => tx('readonly', s => s.get(k)).catch(() => null),
    put: (k, v) => tx('readwrite', s => s.put(v, k)),

async function loadBitmap(blob){
  try { return await createImageBitmap(blob, { imageOrientation:'from-image' }); }
  catch { return await new Promise((res, rej) => { const i = new Image(); const u = URL.createObjectURL(blob); i.onload = () => { res(i); }; i.onerror = rej; i.src = u; }); }
}
async function drawTo(blob, max, q){
  const bm = await loadBitmap(blob); const w0 = bm.width, h0 = bm.height; const k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0*k); c.height = Math.round(h0*k);
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); if(bm.close) bm.close();
  return { canvas:c, w:w0, h:h0 };
}
const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
async function makeThumb(blob){ try { const { canvas } = await drawTo(blob, 480); return await toBlob(canvas, .78); } catch { return null; } }
async function compressImage(file){ // 아이디어 참고 이미지 전용 (썸네일 원본은 화질 보존)
  try {
    const { canvas } = await drawTo(file, 1280); let q = .85, b = await toBlob(canvas, q);
    while(b && b.size > 512*1024 && q > .45){ q -= .1; b = await toBlob(canvas, q); }
    return b && b.size < file.size ? new File([b], stripExt(file.name)+'.jpg', { type:'image/jpeg' }) : file;
  } catch { return file; }
}
function mediaMeta(blob, kind){
  return new Promise(res => {
    const v = document.createElement(kind); v.preload = 'metadata'; v.muted = true; if(kind==='video') v.playsInline = true;
    const u = URL.createObjectURL(blob); let done = false;
    const fin = r => { if(done) return; done = true; v.removeAttribute('src'); try{ v.load(); }catch{} URL.revokeObjectURL(u); res(r); };
    const tm = setTimeout(() => fin({ dur: isFinite(v.duration) ? v.duration : 0 }), 10000);
    v.onerror = () => { clearTimeout(tm); fin({}); };
    v.onloadedmetadata = () => {
      if(kind === 'audio'){ clearTimeout(tm); fin({ dur: isFinite(v.duration) ? v.duration : 0 }); return; }
      try { v.currentTime = Math.min(2, (v.duration||1)/3); } catch { clearTimeout(tm); fin({ dur:v.duration }); }
    };
    v.onseeked = async () => {
      clearTimeout(tm);
      try {
        const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth) || 270;
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h);
        fin({ dur: v.duration, thumb: await toBlob(c, .78) });
      } catch { fin({ dur: v.duration }); }
    };
    v.src = u;
  });
}
let persistAsked = false;
async function ingest(file, folder){
  if(!persistAsked){ persistAsked = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }
  const id = uid(); let blob = file;
  const meta = { id, name: file.name || 'file', type: file.type || guessType(file.name), size: file.size };
  if(folder === 'idea' && isImg(meta)){ blob = await compressImage(file); meta.size = blob.size; meta.type = blob.type || meta.type; }
  if(isImg(meta)){
    const t = await makeThumb(blob); if(t){ await idb.put(id+'_t', t); meta.th = 1; }
  } else if(isAud(meta)){
    const m = await mediaMeta(blob, 'audio'); meta.dur = m.dur || 0;
  } else if(isVid(meta)){
    const m = await mediaMeta(blob, 'video'); meta.dur = m.dur || 0;
    if(m.thumb){ await idb.put(id+'_t', m.thumb); meta.th = 1; }
  }
  await idb.put(id, blob);
  return meta;
}

/* 표시용 URL: 로컬 IndexedDB → 클라우드 (CORS 막히면 URL 직접 사용) */
const ucache = new Map();
async function thumbSrc(f){
  const k = f.id + '_t'; if(ucache.has(k)) return ucache.get(k);
  let b = await idb.get(k);
  if(!b && f.th && f.up){
    try {
      const u = await remoteURL(k);
      try { const r = await fetch(u); if(!r.ok) throw 0; b = await r.blob(); idb.put(k, b).catch(()=>{}); }
      catch { ucache.set(k, u); return u; }
    } catch {}
  }
  if(!b && isImg(f)){ const o = await idb.get(f.id); if(o){ b = await makeThumb(o); if(b){ idb.put(k, b).catch(()=>{}); } } }
  if(!b) return null;
  const u = URL.createObjectURL(b); ucache.set(k, u); return u;
}
async function fullSrc(f, quiet){
  if(ucache.has(f.id)) return ucache.get(f.id);
  const b = await idb.get(f.id);
  if(b){ const u = URL.createObjectURL(b); ucache.set(f.id, u); return u; }
  if(f.up){ try { return await remoteURL(f.id); } catch(e) { if(!quiet) toast('파일 불러오기 실패: ' + explain(e)); } }
  return null;
}
const fileIndex = new Map();
function indexFiles(){ fileIndex.clear(); for(const it of live()) for(const f of (it.files||[])) fileIndex.set(f.id, f); }
const io = new IntersectionObserver(es => {
  for(const e of es){
    if(!e.isIntersecting) continue; io.unobserve(e.target);
    const el = e.target, f = fileIndex.get(el.dataset.fid); if(!f) continue;
    thumbSrc(f).then(u => { if(u){ el.style.backgroundImage = `url("${u}")`; el.classList.add('has'); } });

}
function ytPh(url, extra=''){ const id = ytId(url); return id ? `<div class="ph has ${extra}" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')">▶</div>` : ''; }

/* ================= Firebase 동기화 (연결 코드) ================= */
const FBV = '10.12.2';
let fb = null, unsub = null, syncState = 'off', firstSnap = true;
function getCfg(){ try { const s = localStorage.getItem(LS.cfg); if(s) return JSON.parse(s); } catch {} return window.FIREBASE_CONFIG || null; }
const getCode = () => localStorage.getItem(LS.code) || '';
async function loadFb(){
  if(fb) return fb;
  const cfg = getCfg(); if(!cfg || !cfg.projectId) throw new Error('Firebase 설정이 없습니다');
  const base = `https://www.gstatic.com/firebasejs/${FBV}/`;
  const [A, F, S] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js'), import(base+'firebase-storage.js')]);
  const app = A.initializeApp(cfg);
  fb = { F, S, db: F.getFirestore(app), st: cfg.storageBucket ? S.getStorage(app) : null };
  return fb;
}
function explain(e){
  const c = (e && e.code) || '', m = (e && e.message) || '';
  if(/permission|unauthorized|unauthenticated/.test(c)) return '권한 없음 (보안 규칙 확인)';
  if(/quota/.test(c)) return '용량/할당량 초과';
  if(/bucket-not-found|no-default-bucket|project-not-found/.test(c)) return 'Storage가 활성화되지 않음';
  if(/not-found/.test(c)) return '대상을 찾을 수 없음';
  if(/unavailable|network|retry-limit/.test(c)) return '네트워크 연결 문제';
  if(/Failed to fetch|NetworkError|Load failed/.test(m)) return '다운로드 차단 (CORS 설정 필요하거나 오프라인)';
  return c || m || '알 수 없는 오류';
}
function setSync(s){ syncState = s; const d = $('#dot'); d.className = 'dot ' + (s==='on'?'on':s==='wait'?'wait':s==='err'?'err':''); }
async function connect(){
  if(unsub){ try { unsub(); } catch {} unsub = null; }
  const code = getCode(); firstSnap = true;
  if(!code || !getCfg()){ setSync('off'); return; }
  setSync('wait');
  try {
    const { F, db } = await loadFb();
    unsub = F.onSnapshot(F.doc(db, 'spaces', code), snap => {
      const remote = (snap.exists() && snap.data().items) || [];
      const merged = merge(items, remote);
      if(sig(merged) !== sig(items)){ items = merged; save(); render(); }
      if(sig(merged) !== sig(remote)) scheduleSync();
      setSync('on');
      if(firstSnap){ firstSnap = false; render(); processUploads(); }
    }, err => { setSync('err'); toast('동기화 오류: ' + explain(err), 4000); });
  } catch(e) { setSync('err'); toast('동기화 연결 실패: ' + explain(e), 4000); }
}
let pushT = null, pushing = false;
function scheduleSync(){ if(!getCode() || !getCfg()) return; clearTimeout(pushT); pushT = setTimeout(push, 700); }
async function push(){
  if(!navigator.onLine) return;
  if(pushing){ scheduleSync(); return; }
  pushing = true;
  try {
    const { F, db } = await loadFb(); const ref = F.doc(db, 'spaces', getCode());
    await F.runTransaction(db, async tx => {
      const s = await tx.get(ref); const remote = (s.exists() && s.data().items) || [];
      tx.set(ref, { items: JSON.parse(JSON.stringify(merge(items, remote))), updated: Date.now() });
    });
    if(syncState !== 'on') setSync('on');
  } catch(e) { setSync('err'); toast('동기화 저장 실패: ' + explain(e), 4000); }
  finally { pushing = false; }
}
let upBusy = false, upAgain = false, upErr = '', upRetryT = null;
const pendingUploads = () => live().reduce((n, it) => n + (it.files||[]).filter(f => !f.up && !f.big).length, 0);
function uploadBlob(path, blob, label){
  return new Promise((res, rej) => {
    const { S, st } = fb;
    const t = S.uploadBytesResumable(S.ref(st, `spaces/${getCode()}/${path}`), blob, { contentType: blob.type || guessType(label||path) });
    t.on('state_changed', s => { if(label) showProgress(`☁️ 업로드 중: ${label} (${fmtSize(s.bytesTransferred)} / ${fmtSize(s.totalBytes)})`, s.bytesTransferred / (s.totalBytes||1)); }, rej, res);
  });
}
function markFile(itemId, fileId, patch){
  const cur = byId(itemId); if(!cur || cur.deleted) return;
  const f = (cur.files||[]).find(x => x.id === fileId); if(!f) return;
  Object.assign(f, patch); cur.updated = Date.now(); save(); scheduleSync();
}
async function processUploads(){
  if(!getCode() || !getCfg() || !navigator.onLine) return;
  if(upBusy){ upAgain = true; return; }
  let x; try { x = await loadFb(); } catch { return; }
  if(!x.st) return;
  upBusy = true; upAgain = false; let n = 0;
  try {
    for(const it of live()){
      for(const f of (it.files||[]).slice()){
        if(f.up || f.big) continue;
        const blob = await idb.get(f.id); if(!blob) continue;
        if(blob.size > MAXUP){ markFile(it.id, f.id, { big:1 }); toast(`"${f.name}" 은(는) 1GB를 넘어 이 기기에만 저장됩니다`, 4000); continue; }
        const tb = f.th ? await idb.get(f.id+'_t') : null;
        if(tb) await uploadBlob(f.id+'_t', tb);

  } catch(e) {

    toast('파일 업로드 실패: ' + explain(e) + ' — ⚙️ 설정에서 확인', 5000);
    clearTimeout(upRetryT); upRetryT = setTimeout(processUploads, 60000); // 1분 뒤 자동 재시도

const rurl = new Map();

  if(rurl.has(key)) return rurl.get(key);

const FORM_FIELDS = ['fTitle','fSt','fMood','fTgt','fYt','fPl','fTags','fMemo'];
const draftKey = () => 'mk_draft_' + (form.id || 'new_' + form.folder);
function formVals(){ const o = {}; for(const k of FORM_FIELDS){ const e = document.getElementById(k); if(e) o[k] = e.value; } return o; }
function formDirty(){
  if(!form || !form.init) return false;
  const v = formVals(); if(FORM_FIELDS.some(k => (v[k] ?? '') !== (form.init[k] ?? ''))) return true;

}
function saveDraft(){ if(!form) return; try { const v = formVals(); if(FORM_FIELDS.some(k => (v[k] ?? '') !== (form.init[k] ?? ''))) localStorage.setItem(draftKey(), JSON.stringify(v)); else localStorage.removeItem(draftKey()); } catch {} }

function clearDraft(){ try { localStorage.removeItem(draftKey()); } catch {} }
function addPend(fs){
  if(!form) return;

    return fd==='thumb'||fd==='idea' ? /^image\//.test(t) : fd==='music' ? /^audio\//.test(t) : /^video\//.test(t); });
  if(ok.length < fs.length) toast(`${fs.length-ok.length}개 파일은 형식이 맞지 않아 제외했어요`);
  if(fd !== 'idea' && it) form.pend = ok.slice(0,1); else form.pend.push(...ok);

async function playCur(){

  if(!(it.files||[])[0]){ if(qi < queue.length-1){ qi++; return playCur(); } return; } // 링크만 있는 곡은 건너뜀
  const src = await fullSrc(it.files[0], true);

async function showView(){

  $('#vCnt').textContent = `${vw.i+1} / ${vw.list.length}  ·  ${f.name||''}`;
  document.querySelectorAll('.vnav').forEach(b => b.style.visibility = vw.list.length > 1 ? 'visible' : 'hidden');

}
function vstep(d){ if(vw.list.length < 2) return; vw.i = (vw.i + d + vw.list.length) % vw.list.length; showView(); }
function applyV(){
  const r = vStage.getBoundingClientRect(); const mx = r.width*(vw.s-1)/2, my = r.height*(vw.s-1)/2;

}
function zoomAt(ns, cx, cy){
  ns = Math.max(1, Math.min(6, ns)); const r = vStage.getBoundingClientRect();

const P = new Map(); let gest = null, lastTap = 0;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

  else if(P.size === 1) gest = { sx: e.clientX, sy: e.clientY, x: vw.x, y: vw.y, moved: false, onImg: e.target === vImg };

    const [a,b] = [...P.values()]; vw.s = gest.s; vw.x = gest.x; vw.y = gest.y;
    zoomAt(gest.s * dist(a,b) / gest.d, gest.m.x, gest.m.y);

    const dx = e.clientX - gest.sx, dy = e.clientY - gest.sy;
    if(Math.abs(dx) + Math.abs(dy) > 8) gest.moved = true;

function endPtr(e){

  if(gest.moved){ if(vw.s === 1 && dx < -60) vstep(1); else if(vw.s === 1 && dx > 60) vstep(-1); else applyV(); }

    const before = sig(items); items = merge(items, arr.filter(x => x && x.id)); save(); scheduleSync(); render();
    toast(before === sig(items) ? '바뀐 내용이 없어요' : '가져오기 완료 (합쳐짐)');
  } catch(err) { toast('가져오기 실패: ' + err.message); }
});

/* ================= 이벤트 위임 ================= */
const ACT = {
  back: () => uiBack(),
  tab: d => { tab = d.v; filt = 'all'; localStorage.setItem(LS.tab, tab); render(); window.scrollTo(0, 0); },
  chip: d => { filt = d.v; render(); },
  add: () => openForm(tab),
  open: d => openDetail(d.id),
  play: d => { if(queue[qi] === d.id){ player.paused ? player.play() : player.pause(); return; } const L = visible().map(x => x.id); playQueue(L, L.indexOf(d.id)); },
  playOne: d => { const it = byId(d.id); const L = liveIdea(it.pl) ? ideaStats(it.pl).mus.map(x=>x.id) : [d.id]; playQueue(L, Math.max(0, L.indexOf(d.id))); },
  playIdea: d => { const L = ideaStats(d.id).mus.map(x => x.id); playQueue(L, +d.i || 0); },
  edit: d => { const it = byId(d.id); openForm(it.folder, it.id); },
  del: d => delItem(d.id),
  dl: d => { const it = byId(d.id); if(it && it.files[0]) download(it.files[0]); },
  view: d => { const it = byId(d.id); if(it.folder === 'idea') openViewer(it.files, +d.i || 0); else { let L = visible().filter(x => x.files[0]); if(!L.includes(it)) L = [it]; const k = L.indexOf(it); openViewer(L.map(x => x.files[0]), Math.max(0, k)); } },
  vdl: () => download(vw.list[vw.i]), vprev: () => vstep(-1), vnext: () => vstep(1),
  status: d => { const it = byId(d.id); upsert({ ...it, status: d.v }); render(); },
  mv: d => moveTrack(d.pl, d.id, +d.d),
  stamps: async d => { const s = timestamps(d.id); await copyText(s); toast('유튜브 설명란용 타임스탬프를 복사했어요'); },
  pickOpen: d => openPick(d.id, d.f), savePick,
  addTo: d => openForm(d.f, null, { pl: d.id }),
  formBd: () => { if(formDirty()){ const p = $('#formPanel'); p.animate([{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}], {duration:220}); toast('작성 중이에요 — 저장 또는 취소 버튼을 눌러주세요'); } else uiBack(); },
  formCancel: () => { if(formDirty() && !confirm('작성 중인 내용을 버릴까요?')) return; clearDraft(); if(form) form.saved = true; uiBack(); },
  saveForm, unpend: d => { const x = form.pend.splice(+d.v, 1)[0]; if(x && x._u) URL.revokeObjectURL(x._u); renderPend(); },
  unkeep: d => { form.keep = form.keep.filter(x => x !== d.v); renderPend(); },
  mToggle: () => player.paused ? player.play() : player.pause(), mPrev: () => step(-1), mNext: () => step(1), mClose: closeMini,
  miniOpen: () => { const it = byId(queue[qi]); if(it) openDetail(liveIdea(it.pl) ? it.pl : it.id); },
  settings: () => openLayer('settings', renderSettings),
  newCode: () => { localStorage.setItem(LS.code, genCode()); connect(); renderSettings(); toast('연결 코드를 만들었어요. 다른 기기에 이 코드를 입력하세요'); },
  copyCode: async () => { await copyText(getCode()); toast('코드를 복사했어요'); },
  enterCode: () => { const v = (prompt('다른 기기의 연결 코드를 입력하세요') || '').trim(); if(!v) return; if(v.length < 10) return toast('코드는 10자 이상이어야 해요'); localStorage.setItem(LS.code, v); rurl.clear(); connect(); renderSettings(); toast('연결했어요. 자료를 합치는 중…'); },
  clearCode: () => { if(!confirm('이 기기의 동기화를 끌까요? (이 기기 자료는 그대로 남아요)')) return; localStorage.removeItem(LS.code); connect(); renderSettings(); },
  saveCfg: () => { const c = parseCfg($('#cfgIn').value); if(!c) return toast('firebaseConfig 형식을 확인하세요 (apiKey, projectId 필요)'); localStorage.setItem(LS.cfg, JSON.stringify(c)); toast('저장했어요. 다시 불러옵니다'); setTimeout(() => location.reload(), 600); },
  clearCfg: () => { localStorage.removeItem(LS.cfg); location.reload(); },
  diag, export: exportJSON,
  retryUp: () => { upErr = ''; clearTimeout(upRetryT); toast('업로드를 다시 시도해요'); processUploads().then(() => isOpen('settings') && renderSettings()); }, import: () => $('#importFile').click(),
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if(!a) return;
  const fn = ACT[a.dataset.act]; if(!fn) return;
  if(a.tagName !== 'A') e.preventDefault();
  fn(a.dataset, e, a);
});
document.addEventListener('keydown', e => {
  if(isOpen('viewer')){ if(e.key === 'ArrowRight') vstep(1); else if(e.key === 'ArrowLeft') vstep(-1); }
  if(e.key === 'Escape' && uiStack.length) uiBack();
});
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { q = e.target.value.trim(); render(); }, 150); });

/* ================= 시작 ================= */
render();
connect();
if('serviceWorker' in navigator){
  if(navigator.serviceWorker.controller){ let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloaded) return; reloaded = true; location.reload(); }); }
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then(r => r.update()).catch(() => {}));
}
</script>
</body>
